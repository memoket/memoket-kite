<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2Wiki · 原文与提取检查器</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><span class="brand">K</span><div><h1>2Wiki 原文与提取检查器</h1><p>原始数据 → 单轮提取 → 实际入库内容</p></div></div><div class="actions"><a href="indexing.html#doc=d3346df4e4b50f73acf82">整段索引小试</a><button id="about">数据说明</button></div></header>
<div class="metrics" id="metrics"><span>正在读取本地数据…</span></div>
<div class="workspace"><aside><div class="tabs"><button id="questionTab" class="active">按题目查看</button><button id="documentTab">浏览整个库</button></div><label class="search"><span>⌕</span><input id="search" placeholder="搜索问题、题号…" aria-label="搜索数据"></label><select id="filter" aria-label="筛选文档" hidden><option value="all">所有原文</option><option value="mismatch">标题代码查不到本篇事实</option><option value="repeat">存在相同事实文本</option><option value="empty">没有提取事实</option></select><div class="listbar"><span id="listCount"></span><span>仅本地 · 只读</span></div><div id="list" class="list"></div><div class="pager"><button id="prevPage">上一页</button><span id="pageLabel"></span><button id="nextPage">下一页</button></div></aside>
<main><section id="questionPanel" class="question-panel"></section><section class="docbar"><div><div class="eyebrow">当前原文</div><h2 id="docTitle">加载中</h2><div id="docMeta" class="subtle"></div></div><div class="actions"><button id="rawSource">原文 JSON</button><button id="rawFacts">提取 JSON</button><button id="rawXML">入库 XML</button></div></section><div id="docWarning"></div><div class="comparison"><section class="source-pane"><div class="pane-title"><h3>原始内容 <span>Source</span></h3><button id="clearHighlight" hidden>清除高亮</button></div><div class="source-note">点击右侧事实，定位原文中完全一致的文字。未匹配不等于事实错误。</div><article id="sourceText"></article><details class="source-details"><summary>来源记录与原始粒度</summary><div id="sourceDetails"></div></details><details class="source-details"><summary id="relatedTitle">关联题目</summary><div id="relatedQuestions"></div></details></section><section class="facts-pane"><div class="pane-title"><h3>实际提取事实 <span id="factCount"></span></h3><button id="expandFacts">展开全部字段</button></div><div class="source-note">字段来自现有底库，不是重新提取；不自动判定事实正确与否。</div><div id="facts"></div></section></div></main></div>
<dialog id="dialog"><div class="dialog-head"><h3 id="dialogTitle"></h3><button id="closeDialog" aria-label="关闭">关闭 ×</button></div><div id="dialogBody"></div></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
