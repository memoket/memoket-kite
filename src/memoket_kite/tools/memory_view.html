<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>KITE · Memory Graph</title>
  <style nonce="__KITE_NONCE__">__KITE_STYLE__</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <strong>KITE</strong>
      <h1 id="title">Memory Graph</h1>
    </div>
    <nav id="workspace-views" class="workspace-views" aria-label="Workspace views" hidden>
      <a id="workspace-graph"></a>
      <a id="workspace-activity"></a>
      <a id="workspace-changes"></a>
    </nav>
    <div class="top-actions">
      <form id="search" role="search" hidden>
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search-terms" type="search" aria-label="Search original evidence" maxlength="512">
        <button id="search-submit" type="submit">Search</button>
      </form>
      <button id="language" type="button" class="quiet">中文</button>
      <button id="refresh" type="button" class="quiet">Refresh</button>
    </div>
  </header>

  <main class="layout">
    <div class="sidebar" id="sidebar">
      <aside class="navigation" aria-labelledby="nav-title">
        <div class="navigation-heading">
          <h2 id="nav-title">Topics</h2>
          <p id="coverage"></p>
        </div>
        <nav id="categories" aria-labelledby="nav-title"></nav>
        <button id="overview" class="overview" type="button" hidden>Back to topics</button>
      </aside>
      <section class="navigation" id="catalog-panel" aria-labelledby="catalog-title" hidden>
        <div class="navigation-heading">
          <h2 id="catalog-title"></h2>
          <p id="catalog-coverage"></p>
        </div>
        <input id="catalog-filter" type="search">
        <nav id="catalog-items" aria-labelledby="catalog-title"></nav>
      </section>
    </div>

    <section class="workspace" aria-labelledby="graph-title">
      <header class="workspace-heading">
        <nav id="breadcrumbs" aria-label="Path"></nav>
        <div class="workspace-title">
          <div>
            <h2 id="graph-title"></h2>
            <p id="graph-summary"></p>
          </div>
          <div id="modes" class="modes" role="group" aria-label="View">
            <button id="all-mode" type="button">All topics</button>
            <button id="topic-mode" type="button">Topic hierarchy</button>
            <button id="memory-mode" type="button">Evidence path</button>
          </div>
        </div>
        <div id="annotations" class="annotation-links" role="group" aria-label="Indexed annotations" hidden>
          <button id="entity-catalog" type="button" data-kind="entity" aria-controls="catalog-panel"></button>
          <button id="facet-catalog" type="button" data-kind="facet" aria-controls="catalog-panel"></button>
          <button id="source-catalog" type="button" data-kind="source" aria-controls="catalog-panel"></button>
        </div>
        <section id="search-trace" class="search-trace" hidden></section>
      </header>
      <div class="viewport">
        <canvas id="graph" tabindex="0" aria-describedby="gesture" aria-label="Three-dimensional memory graph"></canvas>
        <div id="graph-labels" class="graph-labels"></div>
        <p id="empty" class="empty" hidden></p>
        <div id="legend" class="legend"></div>
        <div class="viewport-controls">
          <span id="gesture"></span>
          <div id="zoom-controls" class="zoom-controls" role="group" aria-label="Zoom">
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="zoom-reset" type="button" aria-label="Reset view">100%</button>
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="detail" id="detail" aria-live="polite"></aside>
  </main>

  <main id="activity" class="comparison" hidden>
    <header class="compare-header">
      <h2 id="activity-title"></h2>
      <p id="activity-version"></p>
    </header>
    <div class="activity-grid">
      <section class="detail" id="activity-events"></section>
      <section class="detail" id="activity-runs"></section>
    </div>
  </main>

  <main id="comparison" class="comparison" hidden>
    <header class="compare-header">
      <p id="compare-snapshot" class="compare-snapshot"></p>
      <nav id="compare-examples" class="modes" aria-label="Memory operations"></nav>
      <h2 id="compare-title"></h2>
      <p id="compare-description"></p>
    </header>
    <div class="compare-controls">
      <div id="compare-legend" class="compare-legend"></div>
      <div class="zoom-controls" role="group" aria-label="Zoom">
        <button id="compare-out" type="button" aria-label="Zoom out">−</button>
        <button id="compare-reset" type="button" aria-label="Reset view">100%</button>
        <button id="compare-in" type="button" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="compare-grid">
      <section class="workspace" aria-labelledby="before-heading">
        <header class="compare-frame-heading"><h3 id="before-heading"></h3><p id="before-version"></p></header>
        <div class="viewport">
          <canvas id="before-graph" tabindex="0" aria-labelledby="before-heading"></canvas>
          <div id="before-labels" class="graph-labels"></div>
        </div>
      </section>
      <section class="workspace" aria-labelledby="after-heading">
        <header class="compare-frame-heading"><h3 id="after-heading"></h3><p id="after-version"></p></header>
        <div class="viewport">
          <canvas id="after-graph" tabindex="0" aria-labelledby="after-heading"></canvas>
          <div id="after-labels" class="graph-labels"></div>
        </div>
      </section>
    </div>
    <div class="compare-results">
      <section class="detail" id="compare-changes" aria-live="polite"></section>
      <section class="detail" id="compare-detail" aria-live="polite"></section>
    </div>
  </main>

  <main id="revision-review" class="comparison" hidden></main>
  <script type="application/json" id="kite-memory-data" nonce="__KITE_NONCE__">__KITE_DATA__</script>
  <script nonce="__KITE_NONCE__">__KITE_SCENE__</script>
  <script nonce="__KITE_NONCE__">__KITE_SCRIPT__</script>
</body>
</html>
