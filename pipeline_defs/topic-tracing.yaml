id: topic-tracing
version: 1
description: Trace cross-conversation discussion and decisions by topic.
inputs:
  query: query
stages:
  - id: resolve
    skill: skills/retrieval/topic-tracing/SKILL.md
    tool: resolve
    needs: []
    inputs:
      query: input.query
    output: resolved
    acceptance: Known topic names resolve through aliases and descendants.
  - id: retrieve
    skill: skills/retrieval/topic-tracing/SKILL.md
    tool: retrieve
    needs: [resolve]
    inputs:
      resolved: stage.resolve
    output: matches
    acceptance: Matching fact IDs follow the time and source filters.
  - id: report
    skill: skills/retrieval/evidence-verification/SKILL.md
    tool: report
    needs: [retrieve]
    inputs:
      matches: stage.retrieve
    output: report
    acceptance: Every timeline entry links to original segments and identifies its reported status.
