id: memory-update
version: 1
description: Append a source revision or a cited correction to existing memory.
inputs:
  source: source
  annotations: annotations
stages:
  - id: normalize
    skill: skills/ingestion/source-normalization/SKILL.md
    tool: normalize
    needs: []
    inputs:
      source: input.source
    output: conversation
    acceptance: Source checksum and original segments are available.
  - id: annotate
    skill: skills/memory/memory-update/SKILL.md
    tool: annotate
    needs: [normalize]
    inputs:
      normalized: stage.normalize
      annotations: input.annotations
    output: annotated
    acceptance: A correction is grounded in new source evidence.
  - id: commit
    skill: skills/memory/index-building/SKILL.md
    tool: commit
    needs: [annotate]
    inputs:
      annotated: stage.annotate
    output: receipt
    acceptance: A single validated revision is committed or a repeat is acknowledged.
  - id: verify
    skill: skills/memory/index-building/SKILL.md
    tool: validate_commit
    needs: [commit]
    inputs:
      receipt: stage.commit
    output: integrity
    acceptance: The source records and strict Codebook agree.
