id: memory-update
version: 2
description: Append a source revision or cited annotations to existing memory.
inputs:
  source: source
  annotations: annotations
stages:
  - id: normalize
    skill: skills/ingestion/source-normalization/SKILL.md
    tool: normalize
    needs: []
    inputs:
      source: input.source
    output: conversation
    acceptance: Source checksum and original segments are available.
  - id: annotate
    skill: skills/memory/memory-update/SKILL.md
    tool: annotate
    needs: [normalize]
    inputs:
      normalized: stage.normalize
      annotations: input.annotations
    output: annotated
    acceptance: Every added fact or correction cites the supplied source evidence.
  - id: commit
    skill: skills/memory/index-building/SKILL.md
    tool: amend
    needs: [annotate]
    inputs:
      annotated: stage.annotate
    output: receipt
    acceptance: The revision or annotation additions are committed once, preserving original evidence.
  - id: verify
    skill: skills/memory/index-building/SKILL.md
    tool: validate_commit
    needs: [commit]
    inputs:
      receipt: stage.commit
    output: integrity
    acceptance: The source records and strict Codebook agree.
