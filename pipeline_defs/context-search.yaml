id: context-search
version: 5
description: Search cited original passages, including the same question across two workspace versions.
inputs:
  request: context_request
stages:
  - id: compile
    skill: skills/memory/context-search/SKILL.md
    tool: compile_context
    needs: []
    inputs:
      request: input.request
    output: context_plan
    acceptance: Search phrases and any subquestion index routes are bound to the selected workspace snapshot or comparison snapshots.
  - id: search
    skill: skills/memory/context-search/SKILL.md
    tool: search_context
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: context_evidence
    acceptance: The search returns cited passages within the shared context budget and checks that any reserved original lines support the search clues.
