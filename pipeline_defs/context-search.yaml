id: context-search
version: 2
description: Compile one question or a comparison locally and search original conversation evidence.
inputs:
  request: context_request
stages:
  - id: compile
    skill: skills/memory/context-search/SKILL.md
    tool: compile_context
    needs: []
    inputs:
      request: input.request
    output: context_plan
    acceptance: Each question has its own search phrases and shares the same workspace snapshot.
  - id: search
    skill: skills/memory/context-search/SKILL.md
    tool: search_context
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: context_evidence
    acceptance: Each question returns cited passages within its share of the context budget.
