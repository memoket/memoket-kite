id: context-search
version: 19
description: Search cited original passages, supplement a saved search, or compare workspace versions.
inputs:
  request: context_request
stages:
  - id: compile
    skill: skills/memory/context-search/SKILL.md
    tool: compile_context
    needs: []
    inputs:
      request: input.request
    output: context_plan
    acceptance: Search phrases, task wording, named subjects and recorded value requests are bound to the selected workspace snapshot.
  - id: search
    skill: skills/memory/context-search/SKILL.md
    tool: search_context
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: context_evidence
    acceptance: The search verifies the original lines supporting selected clues and any linked subject within the shared quote budget.
