id: context-search
version: 12
description: Search cited original passages, supplement a saved search, or compare workspace versions.
inputs:
  request: context_request
stages:
  - id: compile
    skill: skills/memory/context-search/SKILL.md
    tool: compile_context
    needs: []
    inputs:
      request: input.request
    output: context_plan
    acceptance: Search phrases, task wording and any independent evidence targets are bound to the selected workspace snapshot.
  - id: search
    skill: skills/memory/context-search/SKILL.md
    tool: search_context
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: context_evidence
    acceptance: The search stays within the shared quote budget and verifies the original lines that support selected clues.
