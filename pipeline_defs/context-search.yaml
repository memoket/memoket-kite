id: context-search
version: 7
description: Search cited original passages, supplement a saved search, or compare workspace versions.
inputs:
  request: context_request
stages:
  - id: compile
    skill: skills/memory/context-search/SKILL.md
    tool: compile_context
    needs: []
    inputs:
      request: input.request
    output: context_plan
    acceptance: Search phrases, implementation task subjects and subquestion index routes are bound to the selected workspace snapshot.
  - id: search
    skill: skills/memory/context-search/SKILL.md
    tool: search_context
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: context_evidence
    acceptance: The search returns cited passages within the shared context budget and checks that any reserved original lines support the search clues.
