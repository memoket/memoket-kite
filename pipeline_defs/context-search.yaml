id: context-search
version: 3
description: Compile a question or use supplied phrases to search original conversation evidence.
inputs:
  request: context_request
stages:
  - id: compile
    skill: skills/memory/context-search/SKILL.md
    tool: compile_context
    needs: []
    inputs:
      request: input.request
    output: context_plan
    acceptance: Supplied phrases or compiled questions are bound to the selected workspace snapshot.
  - id: search
    skill: skills/memory/context-search/SKILL.md
    tool: search_context
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: context_evidence
    acceptance: The search returns cited passages within the shared context budget.
