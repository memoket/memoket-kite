id: symbolic-search
version: 2
description: Compile and execute a KITE symbolic plan against original conversation lines.
inputs:
  request: symbolic_request
stages:
  - id: compile
    skill: skills/memory/symbolic-search/SKILL.md
    tool: compile_symbolic
    needs: []
    inputs:
      request: input.request
    output: symbolic_plan
    acceptance: The validated plan and any explicit recording scope are bound to the workspace version.
  - id: search
    skill: skills/memory/symbolic-search/SKILL.md
    tool: search_symbolic
    needs: [compile]
    inputs:
      compiled: stage.compile
    output: symbolic_evidence
    acceptance: The symbolic engine returns its execution trace and original citations within the quote budget.
